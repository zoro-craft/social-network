<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Social Network">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8e8cf5" />
      <stop offset="0.55" stop-color="#6e6bf0" />
      <stop offset="1" stop-color="#524fcc" />
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22" />
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="16" fill="url(#tile)" />
  <rect x="0.5" y="0.5" width="63" height="63" rx="15.5" fill="url(#sheen)" />
  <rect
    x="0.5"
    y="0.5"
    width="63"
    height="63"
    rx="15.5"
    fill="none"
    stroke="#ffffff"
    stroke-opacity="0.18"
  />

  <g stroke="#ffffff" stroke-width="4" stroke-linecap="round">
    <line x1="32" y1="32" x2="15" y2="18" />
    <line x1="32" y1="32" x2="49" y2="18" />
    <line x1="32" y1="32" x2="32" y2="46" />
  </g>

  <g fill="#ffffff">
    <circle cx="32" cy="32" r="6" />
    <circle cx="15" cy="18" r="6" />
    <circle cx="49" cy="18" r="6" />
    <circle cx="32" cy="46" r="6" />
  </g>
</svg>
