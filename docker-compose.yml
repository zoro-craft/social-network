services:
  backend:
    build: ./backend
    image: social-backend

    environment:
      - DB_PATH=/data/social-network.db
      - UPLOADS_PATH=/uploads

    volumes:
      - ./backend/internal/database:/data
      - ./backend/uploads:/uploads

  frontend:
    build: ./frontend
    image: social-frontend

    depends_on:
      - backend

  caddy:
    image: caddy:alpine

    ports:
      - "80:80"

    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile

    depends_on:
      - frontend
      - backend