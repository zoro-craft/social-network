name: social-network

services:
  backend:
    build: ./backend
    image: elmehdirezoug/social-backend-arm:1.0.0
    restart: unless-stopped
    environment:
      - DB_PATH=/data/social-network.db
      - UPLOADS_PATH=/uploads
    volumes:
      - db_data:/data
      - uploads_data:/uploads
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    image: elmehdirezoug/social-frontend-arm:1.0.0
    restart: unless-stopped
    environment:
      - API_PROXY_TARGET=http://backend:8080
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  db_data:
  uploads_data:
